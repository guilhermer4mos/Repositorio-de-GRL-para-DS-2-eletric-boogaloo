<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Busca CEP</title>
</head>
<body>
    <link rel="stylesheet" href="buscarcep.css">
<div>
    <h1>Buscar CEP</h1>
    <input type="text" id="cep" placeholder="Digite o CEP">

    <button onclick="buscarCEP()">
        Buscar
    </button>

    <h3 id="rua"></h3>
    <h3 id="bairro"></h3>
    <h3 id="cidade"></h3>
    <h3 id="estado"></h3>
</div>
    <script>

        async function buscarCEP() {

            let cep = document.getElementById("cep");

            if (cep.value == "") {
                alert("Digite um CEP");
            } else {

                let resposta = await fetch(`https://viacep.com.br/ws/${cep.value}/json/`);

                let dados = await resposta.json();

                document.getElementById("rua").innerText =
                    "Rua: " + dados.logradouro;

                document.getElementById("bairro").innerText =
                    "Bairro: " + dados.bairro;

                document.getElementById("cidade").innerText =
                    "Cidade: " + dados.localidade;

                document.getElementById("estado").innerText =
                    "Estado: " + dados.uf;
            }
        }

    </script>

</body>
</html>
